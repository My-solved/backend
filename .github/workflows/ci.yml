name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Prepare non-production test credentials
        run: |
          credential_dir="$RUNNER_TEMP/solved-proxy"
          client_id_file="$credential_dir/client-id"
          client_secret_file="$credential_dir/client-secret"
          mkdir -p "$credential_dir"
          printf '%s' 'ci-client-id' > "$client_id_file"
          printf '%s' 'ci-client-secret' > "$client_secret_file"
          {
            printf 'SOLVED_CLIENT_ID_FILE=%s\n' "$client_id_file"
            printf 'SOLVED_CLIENT_SECRET_FILE=%s\n' "$client_secret_file"
          } >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag solved-proxy:ci .

      - name: Smoke-test hardened container
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' solved-proxy:ci)" = node
          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=bind,source="$SOLVED_CLIENT_ID_FILE",target=/run/secrets/solved_client_id,readonly \
            --mount type=bind,source="$SOLVED_CLIENT_SECRET_FILE",target=/run/secrets/solved_client_secret,readonly \
            --env SOLVED_CLIENT_ID_FILE=/run/secrets/solved_client_id \
            --env SOLVED_CLIENT_SECRET_FILE=/run/secrets/solved_client_secret \
            --publish 127.0.0.1:13000:3000 \
            solved-proxy:ci)"
          trap 'docker rm --force "${container_id}"' EXIT
          if ! curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:13000/healthz; then
            docker logs "${container_id}"
            exit 1
          fi
          docker exec "${container_id}" sh -c \
            'test ! -e /app/.env && test ! -e /app/.env.production'
