name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag solved-proxy:ci .

      - name: Smoke-test hardened container
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' solved-proxy:ci)" = node
          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:13000:3000 \
            solved-proxy:ci)"
          trap 'docker rm --force "${container_id}"' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:13000/healthz
          docker exec "${container_id}" sh -c \
            'test ! -e /app/.env && test ! -e /app/.env.production'
