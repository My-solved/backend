services:
  solved-proxy:
    build:
      context: .
    image: solved-proxy:local
    init: true
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 15s
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REQUEST_TIMEOUT_MS: 8000
      MAX_RESPONSE_BYTES: 5242880
      MAX_CONCURRENT_REQUESTS: 8
    ports:
      - "127.0.0.1:${SOLVED_PROXY_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
